<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crisp Heart with I Love You ❤️</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle, #1a051d 0%, #050108 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
    }
    .title {
      position: absolute;
      top: 5%;
      color: #ff758c;
      font-size: 22px;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(255, 117, 140, 0.6);
      pointer-events: none;
      letter-spacing: 1px;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="title">"I Love You meri labbo " ❤️</div>
<canvas id="canvas"></canvas>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  let width = (canvas.width = window.innerWidth);
  let height = (canvas.height = window.innerHeight);

  window.addEventListener("resize", () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  const iLoveYouWords = [
    "I love you", "मैं तुमसे प्यार करता हूँ", "أنا أحبك", "Je t'aime", 
    "Ich liebe dich", "Te amo", "Ti amo", "Я тебя люблю", "사랑해요", "Te quiero", 
    "Mahal kita", "Aku cinta kamu", "Szeretlek", "Volim te", "Σ' αγαπώ", 
    "Seni seviyorum", "Tôi yêu bạn", "Bhalobashi", "Kaadhal", "Ninnu Premistunnanu", 
    "Mi amas vin", "Es mīlu tevi", "Eu te amo", "Te iubesc", "Ľúbim ťa", 
    "Të dua", "Ik hou van jou", "Jeg elsker dig", "Minä rakastan sinua", "Jag älskar dig", 
    "Milujem ťa", "Ana behibak", "Mein Schatz", "Mon amour", "Amore mio", 
    "내 사랑", "Aşkım", "Anh yêu em", "Sayangku", "Mi amor", "Corazón"
  ];

  class Particle {
    constructor(bx, by) {
      this.text = iLoveYouWords[Math.floor(Math.random() * iLoveYouWords.length)];
      this.bx = bx;
      this.by = by;
      this.size = 11; // Fixed readable size taaki text blur ya overlapping na ho
      this.color = `hsl(${Math.random() * 25 + 340}, 100%, 75%)`;
    }

    draw(pulse) {
      let drawX = width / 2 + this.bx * pulse;
      let drawY = height / 2 + this.by * pulse;

      ctx.font = `600 ${this.size}px 'Segoe UI', sans-serif`;
      ctx.fillStyle = this.color;
      ctx.fillText(this.text, drawX, drawY);
    }
  }

  const particles = [];
  let scale = 17;

  // Grid/Mathematical approach taaki heart ki boundary aur andar ka hissa bilkul clear bane
  for (let t = 0; t < Math.PI * 2; t += 0.05) {
    let bx = 16 * Math.pow(Math.sin(t), 3);
    let by = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    
    // Boundary line
    particles.push(new Particle(bx * scale, by * scale));

    // Inner filled layers with controlled step
    for (let r = 0.2; r < 0.9; r += 0.15) {
      particles.push(new Particle(bx * scale * r, by * scale * r));
    }
  }

  function animate() {
    ctx.fillStyle = "rgba(10, 2, 15, 0.4)";
    ctx.fillRect(0, 0, width, height);

    let pulse = 1 + Math.sin(Date.now() * 0.004) * 0.04;

    particles.forEach(p => {
      p.draw(pulse);
    });

    requestAnimationFrame(animate);
  }

  animate();
</script>

</body>
</html>
